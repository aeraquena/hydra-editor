<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hydra Editor</title>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: black;
      }

      iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 0;
      }

      .CodeMirror {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.35);
        z-index: 10;
        font-size: 18px;
        opacity: 0.5;
      }

      #error {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: #ff6b6b;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px;
        z-index: 20;
      }
    </style>
  </head>

  <body>
    <iframe id="hydra-frame" src="/hydra.html"></iframe>

    <textarea id="editor"></textarea>
    <div id="error"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
