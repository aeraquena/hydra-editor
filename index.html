<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hydra Editor</title>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: black;
      }

      iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 0;
      }

      .CodeMirror {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh !important;
        background: transparent !important;
        z-index: 10;
        font-size: 24px;
        overflow: hidden;
      }

      .CodeMirror-scroll {
        overflow-y: auto !important;
        overflow-x: hidden !important;
      }

      /*.CodeMirror,
      .CodeMirror-scroll {
        height: 100% !important;
      }*/

      #error {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: #ff0000;
        padding: 8px;
        z-index: 20;
        font-family: monospace;
        font-size: 24px;
      }

      .CodeMirror-line span {
        background: rgba(0, 0, 0, 0.5) !important;
        padding-left: 4px;
        padding-right: 4px;
      }

      .CodeMirror-gutters {
        background: transparent;
      }

      .error-line {
        background: rgba(255, 0, 0, 0.35) !important;
      }

      .cm-bracket-error {
        color: #ff4d4f !important;
        font-weight: bold;
      }

      .cm-s-material .cm-number {
        color: yellow !important;
      }
    </style>
  </head>

  <body>
    <iframe id="hydra-frame" src="/hydra.html"></iframe>

    <textarea id="editor"></textarea>
    <div id="error"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
