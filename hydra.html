<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body style="margin: 0; overflow: hidden; background: black">
    <script type="module">
      import Hydra from "hydra-synth";

      const hydra = new Hydra({
        detectAudio: false,
      });

      // expose Hydra functions globally
      Object.assign(window, hydra.synth);

      window.addEventListener("message", (event) => {
        if (event.data.type === "eval") {
          try {
            // Wrap code to preserve line numbers
            const wrapped = `
            try {
      ${event.data.code}
            } catch (e) {
              throw e;
            }
            //# sourceURL=hydra-livecode.js
          `;

            eval(wrapped);
          } catch (e) {
            console.error(e);

            let line = null;

            if (e.stack) {
              // Match our fake filename
              const match = e.stack.match(/hydra-livecode\.js:(\d+)/);
              if (match) {
                // subtract wrapper offset (VERY IMPORTANT)
                line = Number(match[1]) - 3;
              }
            }

            parent.postMessage(
              {
                type: "error",
                message: e.message,
                line,
              },
              "*",
            );
          }
        }

        if (event.data.type === "hush") {
          hydra.hush();
        }

        if (event.data.type === "init-midi") {
          window.initMIDI();
        }
      });

      // --- MIDI SETUP ---
      let cc = Array(128).fill(0.5);
      window.cc = cc;

      function getMIDIMessage(midiMessage) {
        const [_, index, value] = midiMessage.data;
        cc[index] = (value + 1) / 128.0;
      }

      function onMIDISuccess(midiAccess) {
        for (const input of midiAccess.inputs.values()) {
          input.onmidimessage = getMIDIMessage;
        }
        console.log("MIDI ready");
      }

      function onMIDIFailure() {
        console.log("MIDI failed");
      }

      function k(row, col) {
        if (row === 1) {
          return col + 12;
        } else if (row === 2) {
          return col + 28;
        } else if (row === 3) {
          return col + 48;
        }
      }
      function s(col) {
        return col + 76;
      }

      // must be triggered by user gesture
      window.initMIDI = () => {
        navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
      };
    </script>
  </body>
</html>
