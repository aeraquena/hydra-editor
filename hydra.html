<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body style="margin: 0; overflow: hidden; background: black">
    <script type="module">
      import Hydra from "hydra-synth";

      const hydra = new Hydra({
        detectAudio: false,
      });

      // expose Hydra functions globally
      Object.assign(window, hydra.synth);

      window.addEventListener("message", (event) => {
        if (event.data.type === "eval") {
          try {
            // Wrap code to preserve line numbers
            const wrapped = `
      try {
${event.data.code}
      } catch (e) {
        throw e;
      }
      //# sourceURL=hydra-livecode.js
    `;

            eval(wrapped);
          } catch (e) {
            console.error(e);

            let line = null;

            if (e.stack) {
              console.log("this is e.stack", e.stack);
              // Match our fake filename
              const match = e.stack.match(/hydra-livecode\.js:(\d+)/);
              if (match) {
                // subtract wrapper offset (VERY IMPORTANT)
                line = Number(match[1]) - 1;
                console.log("line: ", line);
              }
            }

            parent.postMessage(
              {
                type: "error",
                message: e.message,
                line,
              },
              "*",
            );
          }
        }

        if (event.data.type === "hush") {
          hydra.hush();
        }
      });
    </script>
  </body>
</html>
